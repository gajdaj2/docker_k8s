apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      source: deployment
  template:
    metadata:
      labels:
        app: nginx
        source: deployment
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
